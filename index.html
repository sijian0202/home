<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="description" content="四件的我的匿名提问箱作品集：产品设计、可交互 Demo、使用流程、界面与卡片结构设计。">
  <title>产品设计与 Vibe Coding 实践｜我的匿名提问箱</title>
  <link rel="stylesheet" href="./portfolio.css">
  <script type="module" src="./portfolio-pages.js"></script>
</head>
<body>
  <main id="portfolio-pages" tabindex="-1" aria-label="产品作品集">
    <h1 class="sr-only">产品设计与 Vibe Coding 实践｜我的匿名提问箱</h1>
    <section class="artwork cover" aria-label="我的匿名提问箱作品封面">
      <img src="./portfolio/cover.webp" width="1920" height="1080" alt="UI/UX 2026。我的匿名提问箱，以匿名问答连接真实交流。银灰色背景上的双手机产品展示。" fetchpriority="high">
    </section>
    <section id="experience" class="experience" aria-labelledby="experience-title">
      <h2 id="experience-title" class="sr-only">可交互产品演示</h2>
      <iframe src="./demo.html" title="我的匿名提问箱可交互 Demo" allow="clipboard-write" referrerpolicy="same-origin"></iframe>
    </section>
    <div id="design" class="design-pages">
      <section class="artwork" aria-label="使用流程">
          <img src="./portfolio/flow.webp" width="1920" height="1080" alt="使用流程：进入广场、提出问题、他人回答、查看回答、持续交流。" loading="lazy" decoding="async">
      </section>
      <section class="artwork" aria-label="产品展示海报">
          <img src="./portfolio/poster.webp" width="1920" height="1080" alt="我的匿名提问箱产品展示，匿名提问、真诚回应和自由交流的界面设计。" loading="lazy" decoding="async">
      </section>
      <section class="artwork" aria-label="高保真模型与票据卡片结构">
          <img src="./portfolio/model.webp" width="1920" height="1080" alt="高保真模型：主界面、提问与回答界面之间的交互关系，以及一、二、三号票据卡片的组合结构。" loading="lazy" decoding="async">
      </section>
      <section class="artwork" aria-label="真机使用场景">
          <img src="./portfolio/hands.webp?v=20261016" width="1920" height="1080" alt="手持手机体验匿名提问箱的产品使用场景。" loading="lazy" decoding="async">
      </section>
      <section class="artwork" aria-label="Question Box APP 视觉展示">
          <img src="./portfolio/closing.webp" width="1920" height="1080" alt="Question Box APP，手机与独立问答票据卡片的最终视觉展示。" loading="lazy" decoding="async">
      </section>
    </div>
  </main>

</html>
